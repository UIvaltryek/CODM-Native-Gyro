name: Build Native Module

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b

    - name: Download Zygisk Header
      run: curl -o zygisk.hpp https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp

    - name: Build with CMake
      run: |
        # 1. Download official Dobby manually
        git clone https://github.com/jmpews/Dobby.git
        
        # 2. Inject the C-preprocessor fix directly into Dobby's own code
        echo 'set(CMAKE_ASM_FLAGS "${CMAKE_ASM_FLAGS} -x assembler-with-cpp -D__ANDROID__=1")' | cat - Dobby/CMakeLists.txt > temp && mv temp Dobby/CMakeLists.txt
        
        # 3. Build the project (Forcing static libraries so Dobby is merged into our .so)
        mkdir build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-29 \
              -DBUILD_SHARED_LIBS=OFF \
              ..
        make

    - name: Package Magisk Module
      run: |
        mkdir -p package/zygisk
        cp build/libnative_gyro.so package/zygisk/arm64-v8a.so
        cp module.prop package/
        cd package && zip -r ../Native-Gyro.zip .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Native-Gyro-Module
        path: package/Native-Gyro.zip
