name: Build Native Module

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b

    - name: Download Zygisk Header
      run: curl -o zygisk.hpp https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp

    - name: Build with CMake
      run: |
        git clone https://github.com/LSPosed/Dobby.git
        
        # Force Dobby to compile statically into our module
        sed -i 's/SHARED/STATIC/g' Dobby/CMakeLists.txt
        
        # 1. Build the 64-bit library
        mkdir build64 && cd build64
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-29 \
              -DDOBBY_GENERATE_SHARED=OFF \
              ..
        make
        cd ..
        
        # 2. Build the 32-bit library for Zygisk compatibility
        mkdir build32 && cd build32
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=armeabi-v7a \
              -DANDROID_PLATFORM=android-29 \
              -DDOBBY_GENERATE_SHARED=OFF \
              ..
        make
        
    - name: Package Magisk Module
      run: |
        mkdir -p package/zygisk
        cp build64/libnative_gyro.so package/zygisk/arm64-v8a.so
        cp build32/libnative_gyro.so package/zygisk/armeabi-v7a.so
        cp module.prop package/
        cd package && zip -r ../Native-Gyro.zip .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Native-Gyro-Module
        path: Native-Gyro.zip
